<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuardSystem — Ocorrências</title>
    <link rel="stylesheet" href="/global/global.css" />
    <script src="/global/utils.js" defer></script>
    <script src="/js/ocorrencias.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="logo">
        <img src="/assets/GuarSystem.png" alt="GuardSystem" />
      </div>

      <!-- Lista preenchida pelo JS -->
      <div class="list-container" id="lista-ocorrencias"></div>

      <a class="btn btn-dark" href="home.html" style="text-align:center; text-decoration:none;">
        Voltar para o início
      </a>

      <!-- Modal: Excluir Ocorrência -->
      <div class="modal-overlay" id="modal-excluir-ocorrencia">
        <div class="modal">
          <h3>Excluir Ocorrência</h3>
          <p>Deseja mesmo excluir esta ocorrência?</p>
          <div class="modal-actions">
            <button class="modal-btn" onclick="closeModal('modal-excluir-ocorrencia')">
              Não
            </button>
            <button class="modal-btn confirm" onclick="confirmarExcluirOcorrencia()">
              Sim
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </body>
</html>
