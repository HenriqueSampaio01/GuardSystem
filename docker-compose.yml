services:
  php:
    image: php:8.2-apache
    build: .
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: guardsystem
    ports:
      - "3306:3306"
    volumes:
    - ./guardsystem.sql:/docker-entrypoint-initdb.d/guardsystem.sql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db